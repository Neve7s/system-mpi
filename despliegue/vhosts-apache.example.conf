# EJEMPLO ORIENTATIVO: requiere certificados SSL, DNS y ajuste de rutas, usuarios, PHP-FPM.
# NO usar directamente sin revisar la configuración del servidor.
<VirtualHost *:443>
 ServerName megaprimeimport.com
 DocumentRoot /var/www/mpi-v1/tienda/public
 <Directory /var/www/mpi-v1/tienda/public>
  Require all granted
  AllowOverride All
  Options -Indexes
 </Directory>
 # SSLEngine on
 # SSLCertificateFile ...
 # SSLCertificateKeyFile ...
</VirtualHost>
