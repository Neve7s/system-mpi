# Fragmento para el bloque server HTTPS real (certificados/TLS en el server exterior).
# Actualizar rutas y socket PHP-FPM. NO activar sin validar 'nginx -t'.
root /RUTA/PRIVADA/mega-prime-v85/public;
index index.php;
autoindex off;
client_max_body_size 10m;
location / { try_files $uri $uri/ =404; }
location ~ /\. { deny all; }
location ~* \.(html|json|zip|sql|bak|env|ini|log|conf|sqlite|db|pem|key)$ { deny all; }
# Limitar imágenes publicadas a nombres aleatorios y extensiones verificadas.
location ~ ^/uploads/[a-f0-9]{32}\.(jpg|png|webp)$ { try_files $uri =404; }
location /uploads/ { return 404; }
location ~ ^/(index|admin|panel|quote|privacidad|copias|sesion|sso_callback)\.php$ {
 try_files $uri =404;
 include fastcgi_params;
 fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
 # FastCGI HTTPS on SOLO cuando TLS termina aquí o hay un proxy validado.
 fastcgi_param HTTPS on;
 fastcgi_pass unix:/RUTA/SOCKET/php-fpm.sock;
}
location ~ \.php$ { return 404; }
# En otro bloque server puerto 80: return 301 https://$host$request_uri;
