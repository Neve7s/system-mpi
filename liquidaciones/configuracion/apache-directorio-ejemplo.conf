# PLANTILLA, NO COPIAR SIN CAMBIAR RUTAS / DOMINIO / CERTIFICADO / PHP-FPM
# PHP 8.2+ con pdo_mysql, fileinfo, openssl y sesiones.
# HTTP: todo redirigido a HTTPS.
<VirtualHost *:80>
 ServerName TIENDA.EJEMPLO.COM
 Redirect permanent / https://TIENDA.EJEMPLO.COM/
</VirtualHost>
# HTTPS: configurar certificado válido emitido para el dominio.
<VirtualHost *:443>
 ServerName TIENDA.EJEMPLO.COM
 DocumentRoot /RUTA/PRIVADA/mega-prime-v85/public
 SSLEngine On
 SSLCertificateFile /RUTA/CERTIFICADO/fullchain.pem
 SSLCertificateKeyFile /RUTA/CERTIFICADO/privkey.pem
 <Directory /RUTA/PRIVADA/mega-prime-v85/public>
  Options -Indexes -FollowSymLinks
  AllowOverride None
  Require all granted
  DirectoryIndex index.php
  <FilesMatch "^(?!index\.php$|admin\.php$|panel\.php$|quote\.php$|privacidad\.php$|copias\.php$|sesion\.php$|sso_callback\.php$).*\.php$">
   Require all denied
  </FilesMatch>
  <FilesMatch "(?i)^(?:\..*|.*\.(?:html|json|zip|sql|bak|env|ini|log|conf|sqlite|db|pem|key))$">
   Require all denied
  </FilesMatch>
 </Directory>
 <Directory /RUTA/PRIVADA/mega-prime-v85/public/uploads>
  Options -Indexes
  <FilesMatch "(?i)^(?![a-f0-9]{32}\.(?:jpg|png|webp)$).+">
    Require all denied
  </FilesMatch>
 </Directory>
 <Directory /RUTA/PRIVADA/mega-prime-v85/private>
  Require all denied
 </Directory>
 <Directory /RUTA/PRIVADA/mega-prime-v85/tools>
  Require all denied
 </Directory>
 # PHP-FPM: adapte handler al socket UNIX real. Requiere mod_proxy_fcgi.
 <FilesMatch "\.php$">
  SetHandler "proxy:unix:/RUTA/SOCKET/php-fpm.sock|fcgi://localhost/"
 </FilesMatch>
 Header always set X-Content-Type-Options "nosniff"
</VirtualHost>
