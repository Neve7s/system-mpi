; Referencia para la configuración de PHP-FPM del servidor real (no aplicar sin validar)
expose_php=Off
display_errors=Off
log_errors=On
session.use_strict_mode=1
session.use_only_cookies=1
session.cookie_httponly=1
session.cookie_secure=1
upload_max_filesize=6M
post_max_size=10M
memory_limit=256M
max_execution_time=60
