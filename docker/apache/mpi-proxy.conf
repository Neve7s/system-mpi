# TLS termina en Coolify/Traefik. Este contenedor solo habla HTTP por el puerto 80.
# Las aplicaciones comprueban $_SERVER['HTTPS'], así que lo forzamos a "on".
SetEnv HTTPS on
SetEnvIf X-Forwarded-Proto https HTTPS=on

# Recuperar la IP real del cliente desde el proxy inverso.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16

ServerName localhost
ServerTokens Prod
ServerSignature Off

# Reglas comunes. Las carpetas públicas tienen su propio .htaccess.
<Directory /var/www/mpi>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Defensa adicional: nunca servir código privado, herramientas o despliegue.
<DirectoryMatch "^/var/www/mpi/(?:acceso/private|acceso/cli|liquidaciones/private|liquidaciones/tools|liquidaciones/configuracion|tienda/app|tienda/cli|tienda/tests|pruebas|docker|despliegue|docs)(?:/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "(?i)^(?:\.env.*|\.git.*|docker-compose\.ya?ml|dockerfile|.*\.(?:sql|log|bak|old|ini|conf|pem|key|crt))$">
    Require all denied
</FilesMatch>
